minimumReleaseAgeExcludePrune: true

trustPolicy: no-downgrade
trustPolicyExcludePrune: true
trustPolicyExclude:
  - semver@6.3.1
  - prisma@7.10.1

shellEmulator: true

packages:
  - apps/*
  - packages/*

allowBuilds:
  '@parcel/watcher': false
  '@prisma/engines': false
  '@swc/core': false
  bcrypt: false
  prisma: false
  sharp: false
  unrs-resolver: false
